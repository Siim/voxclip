# VoxClip CI. Spec: doc/architecture.md section 12.
# Native and cross-platform test projects are required; missing inputs fail before setup.
# Signed releases are never produced here (doc/release.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  VOXCLIP_LIVE_TESTS: "0"
  VOXCLIP_TEST_DOWNLOAD: "0"

jobs:
  macos:
    name: macOS (Swift app, .NET core on macOS)
    runs-on: macos-26
    # Every step after setup has its own budget; the job limit is their sum plus about five minutes of setup.
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v5

      - name: Require integrated macOS and .NET test projects
        shell: bash
        run: |
          for file in apps/macos/Package.swift apps/windows/tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj apps/windows/tests/VoxClip.Core.Tests/Tracks/win-ui/VoxClip.Ui.Tests.csproj apps/windows/tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj tools/captions/parity.sh; do
            test -f "$file" || { echo "::error file=$file::Required test project or parity script is missing"; exit 1; }
          done

      - name: Detect projects
        id: detect
        shell: bash
        run: |
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "swift=$(has apps/macos/Package.swift)"
            echo "core_tests=$(has apps/windows/tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj)"
            echo "ui_tests=$(has apps/windows/tests/VoxClip.Core.Tests/Tracks/win-ui/VoxClip.Ui.Tests.csproj)"
            echo "media_tests=$(has apps/windows/tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj)"
            echo "parity=$(has tools/captions/parity.sh)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Select the newest Xcode
        if: steps.detect.outputs.swift == 'true'
        shell: bash
        run: |
          XCODE=$(/bin/ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          swift --version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "::error::macOS SDK $SDK is older than the macOS 26 minimum"; exit 1; }

      - name: Release accent asset catalog (actool)
        if: steps.detect.outputs.swift == 'true'
        timeout-minutes: 5
        shell: bash
        run: python3 apps/macos/scripts/test_release.py -k asset_catalog

      - name: Probe the video encoder (diagnostic only)
        if: steps.detect.outputs.swift == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: swift tools/ci/macos-encoder-probe.swift "$(xcrun --sdk macosx --show-sdk-version)" || echo "::warning::The encoder probe exited with status $?"

      - name: Set up Python (schema check and caption image comparator, macOS)
        id: py
        if: steps.detect.outputs.swift == 'true' || steps.detect.outputs.core_tests == 'true' || steps.detect.outputs.media_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Draft 2020-12 validator and numpy (macOS)
        if: steps.detect.outputs.swift == 'true' || steps.detect.outputs.core_tests == 'true' || steps.detect.outputs.media_tests == 'true'
        shell: bash
        run: python -m pip install "jsonschema==4.26.0" "numpy==2.5.4"

      - name: Swift build
        id: swift_build
        if: steps.detect.outputs.swift == 'true'
        timeout-minutes: 10
        working-directory: apps/macos
        run: swift build --jobs 2

      # Whole-module Release compile errors show here within minutes; E2E, plan parity and caption parity
      # use this binary. A failed build is rebuilt once with -debug-cycles, which names the declarations
      # behind a compiler request cycle ("<unknown>:0: error: circular reference").
      - name: Build the Release CLI
        id: release_cli
        if: ${{ !cancelled() && steps.swift_build.outcome == 'success' }}
        timeout-minutes: 12
        working-directory: apps/macos
        shell: bash
        run: |
          swift build -c release --jobs 2 --product voxclip-cli && exit 0
          echo "::group::Release CLI rebuild with -debug-cycles"
          swift build -c release --jobs 2 --product voxclip-cli -Xswiftc -Xfrontend -Xswiftc -debug-cycles > "$RUNNER_TEMP/release-cli-cycles.log" 2>&1 || true
          grep -n -A 150 'CYCLE DETECTED' "$RUNNER_TEMP/release-cli-cycles.log" | head -n 1200 || tail -n 200 "$RUNNER_TEMP/release-cli-cycles.log"
          echo "::endgroup::"
          exit 1

      # Core, Media and CaptionParityTests run as separate processes with separate budgets; together they are the
      # whole suite.
      - name: Swift test (VoxClipCoreTests)
        if: ${{ !cancelled() && steps.swift_build.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: apps/macos
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_CAPTION_PYTHON: ${{ steps.py.outputs.python-path }}
        run: swift test --jobs 2 --filter VoxClipCoreTests

      - name: Swift test (headless Voice Lab app model)
        if: ${{ !cancelled() && steps.swift_build.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: apps/macos
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_DATA_DIR: ${{ runner.temp }}/voxclip-voice-lab-app-tests
        run: swift test --jobs 2 --filter VoxClipAppTests

      - name: Swift test (VoxClipMediaTests)
        if: ${{ !cancelled() && steps.swift_build.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: apps/macos
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_CAPTION_PYTHON: ${{ steps.py.outputs.python-path }}
        run: swift test --jobs 2 --filter VoxClipMediaTests --skip CaptionParityTests

      # The caption golden renders keep all three runner cores busy for minutes, so they run alone instead
      # of beside the one-minute heavy media tests.
      - name: Swift test (CaptionParityTests)
        if: ${{ !cancelled() && steps.swift_build.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: apps/macos
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_CAPTION_PYTHON: ${{ steps.py.outputs.python-path }}
        run: swift test --jobs 2 --filter CaptionParityTests

      # Runs after a Swift test failure too, with the Release CLI built above.
      - name: Canonical macOS CLI E2E (Release)
        if: ${{ !cancelled() && steps.release_cli.outcome == 'success' }}
        timeout-minutes: 25
        shell: bash
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_REQUIRE_E2E: "1"
          VOXCLIP_E2E_OUT: ${{ runner.temp }}/voxclip-macos-e2e
        run: |
          VOXCLIP_CLI="$(swift build --package-path apps/macos -c release --show-bin-path)/voxclip-cli" \
            swift test --package-path apps/macos -c release --jobs 2 --filter MediaCliE2ETests
          python3 - "$VOXCLIP_E2E_OUT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/parity")
          from compare_e2e import load_reports
          _, errors = load_reports(Path(sys.argv[1]), "macos")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Validated ten structured macOS CLI E2E reports")
          PY

      - name: Upload macOS CLI E2E reports
        if: always() && steps.detect.outputs.swift == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-reports
          path: ${{ runner.temp }}/voxclip-macos-e2e
          if-no-files-found: warn
          retention-days: 14

      - name: Set up .NET 10
        if: ${{ !cancelled() && (steps.detect.outputs.core_tests == 'true' || steps.detect.outputs.media_tests == 'true') }}
        timeout-minutes: 5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.402"

      - name: .NET core tests on macOS
        if: ${{ !cancelled() && steps.detect.outputs.core_tests == 'true' }}
        timeout-minutes: 10
        working-directory: apps/windows
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_SCHEMA_PYTHON: ${{ steps.py.outputs.python-path }}
          VOXCLIP_REQUIRE_SCHEMA_PYTHON: "1"
        run: |
          dotnet build tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj -c Release -m:1 -nodeReuse:false -p:UseSharedCompilation=false
          dotnet test --project tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj -c Release --no-build

      # The Windows App's view models, layout, navigation and Home rules (VoxClip.App ViewModels and services built under
      # WIN_UI_TESTS). They need no Windows APIs; the two cases that need the ARM64 VM's native media skip themselves.
      - name: .NET win-ui view-model tests on macOS
        if: ${{ !cancelled() && steps.detect.outputs.ui_tests == 'true' }}
        timeout-minutes: 10
        working-directory: apps/windows
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
        run: |
          dotnet build tests/VoxClip.Core.Tests/Tracks/win-ui/VoxClip.Ui.Tests.csproj -c Release -m:1 -nodeReuse:false -p:UseSharedCompilation=false
          dotnet test --project tests/VoxClip.Core.Tests/Tracks/win-ui/VoxClip.Ui.Tests.csproj -c Release --no-build

      - name: .NET media tests on macOS (caption renderer; no FFmpeg, no Windows-only APIs)
        if: ${{ !cancelled() && steps.detect.outputs.media_tests == 'true' }}
        timeout-minutes: 10
        working-directory: apps/windows
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_CAPTION_PYTHON: ${{ steps.py.outputs.python-path }}
          VOXCLIP_REQUIRE_CAPTION_PYTHON: "1"
        run: |
          dotnet build tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj -c Release -m:1 -nodeReuse:false -p:UseSharedCompilation=false
          dotnet test --project tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj -c Release --no-build --filter "Category!=RequiresFFmpeg&Category!=RequiresWindows"

      - name: Shared project plan parity
        if: ${{ !cancelled() && steps.release_cli.outcome == 'success' && steps.detect.outputs.media_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        env:
          VOXCLIP_PLAN_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          VOXCLIP_MAC_CLI="$(swift build --package-path apps/macos -c release --show-bin-path)/voxclip-cli" \
          VOXCLIP_WIN_CLI="$GITHUB_WORKSPACE/apps/windows/src/VoxClip.Cli/bin/Release/net10.0/voxclip-cli" \
            bash tools/parity/plan_parity.sh

      - name: Caption parity (Swift vs C# renders)
        if: ${{ !cancelled() && steps.release_cli.outcome == 'success' && steps.detect.outputs.parity == 'true' && steps.detect.outputs.media_tests == 'true' }}
        timeout-minutes: 20
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_CAPTION_PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash tools/captions/parity.sh "$RUNNER_TEMP/caption-parity"

      - name: Upload caption parity differences
        if: always() && steps.detect.outputs.parity == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: caption-parity-differences
          path: ${{ runner.temp }}/caption-parity/diff
          if-no-files-found: warn
          retention-days: 7

      - name: Build and test the standalone window recorder
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          swift build --package-path tools/media/sckrec --jobs 2 -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300
          swift test --package-path tools/media/sckrec --jobs 2

  hevc-fixture:
    name: Test-only Windows Main 10 fixture
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Generate and verify Main 10 media
        shell: bash
        run: |
          swift tools/fixtures/media/generate.swift --win-hevc "$RUNNER_TEMP/hevc10-two-audio.mp4"
          swift tools/fixtures/media/generate.swift --verify-win-hevc "$RUNNER_TEMP/hevc10-two-audio.mp4"
      - name: Upload test-only Main 10 fixture
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-hevc-input
          path: ${{ runner.temp }}/hevc10-two-audio.mp4
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (.NET tests, WinUI x64 + arm64)
    needs: hevc-fixture
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Require integrated Windows test inputs
        shell: bash
        run: |
          for file in apps/windows/tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj apps/windows/tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj apps/windows/src/VoxClip.Cli/VoxClip.Cli.csproj apps/windows/tests/VoxClip.Media.Tests/generate-fixtures.sh apps/windows/build/Fetch-Ffmpeg.ps1 shared/fixtures/media/index.json; do
            test -f "$file" || { echo "::error file=$file::Required native or CLI test input is missing"; exit 1; }
          done

      - name: Detect projects
        id: detect
        shell: bash
        run: |
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "core_tests=$(has apps/windows/tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj)"
            echo "media_tests=$(has apps/windows/tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj)"
            echo "app=$(has apps/windows/src/VoxClip.App/VoxClip.App.csproj)"
            echo "cli=$(has apps/windows/src/VoxClip.Cli/VoxClip.Cli.csproj)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Set up .NET 10
        if: steps.detect.outputs.core_tests == 'true' || steps.detect.outputs.media_tests == 'true' || steps.detect.outputs.app == 'true' || steps.detect.outputs.cli == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.402"

      - name: Set up Python for schema and image checks
        id: py
        if: steps.detect.outputs.core_tests == 'true' || steps.detect.outputs.media_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema and image comparison prerequisites
        if: steps.detect.outputs.core_tests == 'true' || steps.detect.outputs.media_tests == 'true'
        shell: bash
        run: |
          python -m pip install "jsonschema==4.26.0" "numpy==2.5.4"
          python -I -c 'import jsonschema, numpy'

      - name: .NET core tests
        if: steps.detect.outputs.core_tests == 'true'
        shell: bash
        working-directory: apps/windows
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_SCHEMA_PYTHON: ${{ steps.py.outputs.python-path }}
          VOXCLIP_REQUIRE_SCHEMA_PYTHON: "1"
        run: |
          dotnet build tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj -c Release -m:1 -nodeReuse:false -p:UseSharedCompilation=false
          dotnet test --project tests/VoxClip.Core.Tests/VoxClip.Core.Tests.csproj -c Release --no-build

      - name: Fetch pinned test-only FFmpeg tools
        if: steps.detect.outputs.media_tests == 'true'
        shell: pwsh
        run: apps/windows/build/Fetch-Ffmpeg.ps1 -RuntimeIdentifier win-x64 -TestTools

      - name: Download prepared Main 10 native fixture
        if: steps.detect.outputs.media_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-native-hevc-input
          path: ${{ runner.temp }}/voxclip-hevc

      - name: Generate native Windows media fixtures
        if: steps.detect.outputs.media_tests == 'true'
        shell: bash
        env:
          VOXCLIP_FFMPEG_DIR: ${{ github.workspace }}/apps/windows/build/.cache/ffmpeg/win-x64/test-tools
          VOXCLIP_HEVC_FIXTURE: ${{ runner.temp }}/voxclip-hevc/hevc10-two-audio.mp4
          VOXCLIP_FIXTURE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          set -o pipefail
          tools_dir="$(cygpath -u "$VOXCLIP_FFMPEG_DIR")"
          PATH="$tools_dir:$PATH"
          VOXCLIP_HEVC_FIXTURE="$(cygpath -u "$VOXCLIP_HEVC_FIXTURE")"
          VOXCLIP_FIXTURE_PYTHON="$(cygpath -u "$VOXCLIP_FIXTURE_PYTHON")"
          export PATH VOXCLIP_HEVC_FIXTURE VOXCLIP_FIXTURE_PYTHON
          results_dir="$(cygpath -u "$RUNNER_TEMP")/voxclip-test-results"
          mkdir -p "$results_dir"
          sh apps/windows/tests/VoxClip.Media.Tests/generate-fixtures.sh 2>&1 | tee "$results_dir/fixture-generation.log"

      - name: Build Media tests and CLI with one compile job
        if: steps.detect.outputs.media_tests == 'true'
        shell: bash
        working-directory: apps/windows
        run: dotnet build tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj -c Release -m:1 -nodeReuse:false -p:UseSharedCompilation=false

      - name: Stage only the six test DLLs beside the built CLI
        if: steps.detect.outputs.media_tests == 'true'
        shell: pwsh
        working-directory: apps/windows
        env:
          VOXCLIP_FFMPEG_DIR: ${{ github.workspace }}/apps/windows/build/.cache/ffmpeg/win-x64/test-tools
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content build/ffmpeg.json -Raw | ConvertFrom-Json
          $cli = 'src/VoxClip.Cli/bin/Release/net10.0'
          if (-not (Test-Path "$cli/voxclip-cli.exe")) { throw 'The built CLI is missing.' }
          foreach ($entry in $pin.libraryMajors.PSObject.Properties) {
            $name = "$($entry.Name)-$($entry.Value).dll"
            $source = Join-Path $env:VOXCLIP_FFMPEG_DIR $name
            if (-not (Test-Path $source)) { throw "Missing test DLL: $name" }
            Copy-Item -LiteralPath $source -Destination $cli -Force
          }

      - name: .NET media tests (strict native and CLI E2E)
        if: steps.detect.outputs.media_tests == 'true'
        shell: bash
        working-directory: apps/windows
        env:
          VOXCLIP_SHARED_DIR: ${{ github.workspace }}/shared
          VOXCLIP_FFMPEG_DIR: ${{ github.workspace }}/apps/windows/build/.cache/ffmpeg/win-x64/test-tools
          VOXCLIP_REQUIRE_NATIVE: "1"
          VOXCLIP_REQUIRE_E2E: "1"
          VOXCLIP_CLI: ${{ github.workspace }}/apps/windows/src/VoxClip.Cli/bin/Release/net10.0/voxclip-cli.exe
          VOXCLIP_E2E_OUT: ${{ runner.temp }}/voxclip-test-results/e2e
          VOXCLIP_CAPTION_PYTHON: ${{ steps.py.outputs.python-path }}
          VOXCLIP_REQUIRE_CAPTION_PYTHON: "1"
        run: |
          set -o pipefail
          mkdir -p "$(cygpath -u "$RUNNER_TEMP")/voxclip-test-results"
          dotnet test --project tests/VoxClip.Media.Tests/VoxClip.Media.Tests.csproj -c Release --no-build 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/voxclip-test-results/media-tests.log"
          python - "$VOXCLIP_E2E_OUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          reports = sorted(Path(sys.argv[1]).glob("*.json"))
          assert len(reports) == 10, f"expected ten Windows CLI E2E reports, got {len(reports)}"
          for path in reports:
              report = json.loads(path.read_text(encoding="utf-8"))
              assert path.stem == report["caseId"] and report["platform"] == "windows" and isinstance(report["result"], dict)
          print("Validated ten structured Windows CLI E2E reports")
          PY

      - name: Upload native test log and structured CLI reports
        if: always() && steps.detect.outputs.media_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-test-evidence
          path: ${{ runner.temp }}/voxclip-test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Build WinUI app (win-x64)
        if: ${{ !cancelled() && steps.detect.outputs.app == 'true' }}
        shell: bash
        working-directory: apps/windows
        run: dotnet build src/VoxClip.App/VoxClip.App.csproj -c Release -r win-x64 -p:Platform=x64 -m:1 -nodeReuse:false -p:UseSharedCompilation=false

      - name: Build WinUI app (win-arm64)
        if: ${{ !cancelled() && steps.detect.outputs.app == 'true' }}
        shell: bash
        working-directory: apps/windows
        run: dotnet build src/VoxClip.App/VoxClip.App.csproj -c Release -r win-arm64 -p:Platform=ARM64 -m:1 -nodeReuse:false -p:UseSharedCompilation=false

      - name: Launch the DEBUG Editor on the hosted desktop
        if: ${{ !cancelled() && steps.detect.outputs.app == 'true' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet build apps/windows/src/VoxClip.App/VoxClip.App.csproj -c Debug -r win-x64 -p:Platform=x64 -m:1 -nodeReuse:false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Debug App smoke build failed.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'voxclip-launch-smoke'
          try {
            & apps/windows/tests/VoxClip.Core.Tests/Tracks/win-ui/launch-smoke.ps1 -Root $PWD.Path -EvidenceDir $evidence -RuntimeIdentifier win-x64 -Hosted
            & apps/windows/tests/VoxClip.Core.Tests/Tracks/win-ui/launch-smoke.ps1 -Root $PWD.Path -EvidenceDir (Join-Path $evidence 'ordinary') -RuntimeIdentifier win-x64 -Hosted -OrdinaryOpen
            foreach ($report in @((Join-Path $evidence 'observed-self-check.json'), (Join-Path $evidence 'ordinary/observed-self-check.json'))) {
              $observed = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              if ($observed.status -ne 'ok' -or -not $observed.rootLoaded -or -not $observed.rendered) { throw "Editor launch smoke did not pass: $report" }
            }
            $ordinary = Get-Content -LiteralPath (Join-Path $evidence 'ordinary/observed-self-check.json') -Raw | ConvertFrom-Json
            $passed = @($ordinary.opens | Where-Object { $_.status -eq 'ok' -and $_.rootLoaded -and $_.rendered -and $_.transcriptVisible })
            if ($ordinary.mode -ne 'ordinary-open' -or $passed.Count -lt 5) { throw "Ordinary-open smoke recorded $($passed.Count) of 5 rendered opens." }
          } finally {
            Get-ChildItem $evidence -Recurse -Filter '*self-check.json' | ForEach-Object { Get-Content $_.FullName }
          }

      - name: Upload the Editor launch smoke evidence
        if: ${{ always() && steps.detect.outputs.app == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-editor-launch-smoke
          path: ${{ runner.temp }}/voxclip-launch-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Build CLI
        if: steps.detect.outputs.cli == 'true' && steps.detect.outputs.media_tests != 'true'
        shell: bash
        working-directory: apps/windows
        run: dotnet build src/VoxClip.Cli/VoxClip.Cli.csproj -c Release -m:1 -nodeReuse:false -p:UseSharedCompilation=false

      - name: Compare pre-redesign and current dialog exports
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/track/sol-win-redesign' }}
        shell: pwsh
        run: |
          git fetch --no-tags origin 05105bae02f9199d47728143794b1d285b92357b
          if ($LASTEXITCODE -ne 0) { throw 'The exact round-3 export parent could not be fetched.' }
          python apps/windows/tests/VoxClip.Core.Tests/Tracks/win-ui/export-equivalence.py --tools "$env:GITHUB_WORKSPACE/apps/windows/build/.cache/ffmpeg/win-x64/test-tools" --evidence "$env:RUNNER_TEMP/voxclip-export-equivalence"
          if ($LASTEXITCODE -ne 0) { throw 'Before/after export equivalence failed.' }

      - name: Parse native capture and keyboard scripts
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/track/sol-win-redesign' }}
        shell: pwsh
        run: |
          $scripts = 'capture-windows.ps1', 'run-screenshots.ps1', 'launch-windows.ps1', 'native-accessibility-walk.ps1', 'run-native-flow.ps1'
          foreach ($script in $scripts) {
            $file = Join-Path 'apps/windows/tests/VoxClip.Core.Tests/Tracks/win-ui' $script
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
            if ([IO.File]::ReadAllBytes((Resolve-Path $file)) | Where-Object { $_ -gt 127 }) { throw "$script must remain ASCII." }
            Write-Output "PASS: $script parses; interactive execution still requires the VM."
          }

      - name: Upload dialog export comparison
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/track/sol-win-redesign'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dialog-export-equivalence
          path: |
            ${{ runner.temp }}/voxclip-export-equivalence/*.json
            ${{ runner.temp }}/voxclip-export-equivalence/*.log
            ${{ runner.temp }}/voxclip-export-equivalence/*/manifest.json
            ${{ runner.temp }}/voxclip-export-equivalence/**/*.srt
          if-no-files-found: error
          retention-days: 14

  e2e-parity:
    name: macOS and Windows CLI E2E parity
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: macos-e2e-reports
          path: ${{ runner.temp }}/macos-e2e
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-test-evidence
          path: ${{ runner.temp }}/windows-evidence
      - name: Compare the ten structured CLI reports
        run: python3 tools/parity/compare_e2e.py "$RUNNER_TEMP/macos-e2e" "$RUNNER_TEMP/windows-evidence/e2e"

  fixtures:
    name: Shared fixtures and repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Detect generators and checks
        id: detect
        shell: bash
        run: |
          # A generator is a folder with a package.json that has a "generate" script.
          gen() {
            if [ -f "$1/package.json" ] && grep -q '"generate"[[:space:]]*:' "$1/package.json"; then echo true; else echo false; fi
          }
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "editing=$(gen tools/fixtures/editing)"
            echo "editing_lock=$(has tools/fixtures/editing/package-lock.json)"
            # The editing generator needs the VoxConvo reference (vendored .ts files); without it CI only validates the fixtures.
            if ls tools/fixtures/editing/reference/*.ts >/dev/null 2>&1; then echo "editing_ref=true"; else echo "editing_ref=false"; fi
            echo "llm=$(gen tools/fixtures/llm)"
            echo "schemas=$(has tools/schemas/validate.py)"
            echo "tokens=$(gen tools/design)"
            echo "tokens_lock=$(has tools/design/package-lock.json)"
            echo "styles=$(has tools/captions/check_styles.py)"
            echo "styles_reqs=$(has tools/captions/requirements.txt)"
            echo "version=$(has tools/release/check-version.sh)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.detect.outputs.editing == 'true' || steps.detect.outputs.tokens == 'true' || steps.detect.outputs.llm == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Skip notice (editing fixture generator not present yet)
        if: steps.detect.outputs.editing != 'true'
        run: echo "::notice title=Fixtures::tools/fixtures/editing has no generate script yet; skipping fixture regeneration."

      - name: Install editing fixture generator dependencies
        if: steps.detect.outputs.editing == 'true' && steps.detect.outputs.editing_lock == 'true'
        run: npm ci --prefix tools/fixtures/editing

      - name: Regenerate editing fixtures (writes every fixture, deletes stale ones)
        if: steps.detect.outputs.editing == 'true' && steps.detect.outputs.editing_ref == 'true'
        run: npm --prefix tools/fixtures/editing run generate

      - name: Editing fixtures parse and carry their schema (no VoxConvo reference available)
        if: steps.detect.outputs.editing == 'true' && steps.detect.outputs.editing_ref != 'true'
        shell: bash
        run: |
          echo "::notice title=Fixtures::tools/fixtures/editing/reference has no .ts files; validating committed fixtures without regenerating."
          python3 - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("shared/fixtures/editing").rglob("*.json")):
              d = json.loads(p.read_text(encoding="utf-8"))
              want = str(p.relative_to("shared/fixtures/editing").with_suffix(""))
              if d.get("schema") != "voxclip-editing-fixture/1" or d.get("id") != want:
                  print(f"::error file={p}::bad schema or id"); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Regenerate LLM fixtures
        if: steps.detect.outputs.llm == 'true'
        run: npm --prefix tools/fixtures/llm run generate

      - name: Fixtures must be unchanged
        if: steps.detect.outputs.editing == 'true' || steps.detect.outputs.llm == 'true'
        shell: bash
        run: |
          git diff --exit-code
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "::error::A fixture generator produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture and caption style checker dependencies
        shell: bash
        env:
          STYLES_REQS: ${{ steps.detect.outputs.styles_reqs }}
        run: |
          if [ "$STYLES_REQS" = "true" ]; then
            python -m pip install -r tools/captions/requirements.txt
          else
            python -m pip install "jsonschema==4.26.0" "numpy==2.5.4"
          fi

      - name: Regenerate Voice Lab fixtures and check for drift
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for generator in tools/fixtures/voice-lab/generate*.py; do
            python "$generator"
          done
          status=0
          python tools/fixtures/voice-lab/check_drift.py || status=1
          git diff --exit-code || status=1
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "::error::A Voice Lab generator produced files that are not committed:"
            echo "$untracked"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            # Leave a clean tree, so the checks after this one report only their own drift.
            git checkout -- .
            git clean -fdq
          fi
          exit "$status"

      - name: Regenerate caption fixtures and check for drift
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python tools/captions/gen_fixtures.py
          python tools/captions/gen_cards.py
          python tools/captions/gen_gallery.py
          python tools/captions/gen_card_colors.py
          python tools/captions/gen_box_text_colors.py
          python tools/captions/check_drift.py
          git diff --exit-code
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then echo "::error::Uncommitted caption generator output:"; echo "$untracked"; exit 1; fi

      - name: Caption styles are valid (schema and semantic rules)
        if: ${{ !cancelled() && steps.detect.outputs.styles == 'true' }}
        run: python tools/captions/check_styles.py

      - name: Example projects validate against shared/schemas
        if: ${{ !cancelled() && steps.detect.outputs.schemas == 'true' }}
        run: python tools/schemas/validate.py

      - name: Install design token generator dependencies
        if: ${{ !cancelled() && steps.detect.outputs.tokens == 'true' && steps.detect.outputs.tokens_lock == 'true' }}
        run: npm ci --prefix tools/design

      - name: Regenerate design tokens (Tokens.swift, Tokens.xaml, AccentColor colorset)
        if: ${{ !cancelled() && steps.detect.outputs.tokens == 'true' }}
        shell: bash
        run: |
          npm --prefix tools/design run generate
          npm --prefix tools/design test
          git diff --exit-code
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then echo "::error::Generated token files are not committed:"; echo "$untracked"; exit 1; fi

      - name: Versions agree (Info.plist and Directory.Build.props)
        if: ${{ !cancelled() && steps.detect.outputs.version == 'true' }}
        run: |
          bash tools/release/check-version.sh
          python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Validate JSON in shared/
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$f"; then
              echo "::error file=$f::Invalid JSON"; status=1
            fi
          done < <(git ls-files -z 'shared/*.json' 'shared/**/*.json' 'shared/**/*.voxclip' skills-lock.json)
          exit $status

      - name: Check offline speaker fixtures and calibration policy
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s tools/voice-lab -p 'test_*.py'
          python3 tools/voice-lab/check.py

      - name: Launch media stays within the Git budget
        if: ${{ !cancelled() }}
        run: python3 tools/media/check_budget.py

      - name: Test synthetic launch media (offline)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install -r tools/media/requirements.txt
          nice python -m unittest discover -s tools/media/tests -v

      - name: Build and test the offline static launch page
        if: ${{ !cancelled() }}
        run: |
          node site/build.mjs --release site/fixtures/latest.json
          npm --prefix site test

      - name: No secrets, env files or non-ASCII PowerShell in tracked files
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)azure-signing' | grep -vE '\.env\.example$'; then
            echo "::error::Environment or signing files must never be committed."; status=1
          fi
          pattern='sk-ant-(api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,}|sk-proj-[A-Za-z0-9_-]{80,}|xai-[A-Za-z0-9]{70,}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{80,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|sk_[0-9a-f]{48}|(AZURE_CLIENT_SECRET|AZURE_SIGNING_KVS)[[:space:]]*=[[:space:]]*[^[:space:]<$"'"'"'{}]{8,}'
          set +e
          git ls-files -z | xargs -0 grep -nIE -d skip -s -- "$pattern"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "::error::Possible secret found in a tracked file (see above)."; status=1; fi
          if [ -n "$(git ls-files '*.ps1')" ]; then
            if git ls-files -z '*.ps1' | xargs -0 grep -nP '[^\x00-\x7F]'; then
              echo "::error::PowerShell scripts must be ASCII (Windows PowerShell 5.1 reads them as ANSI)."; status=1
            fi
          fi
          exit $status
