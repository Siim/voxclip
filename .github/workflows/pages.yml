name: Launch page

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      # Match ci.yml's version-tag action pin policy. Build from the default branch on every trigger, so a
      # release run and a dispatch from main publish the same site/ and media pins; the deploy job still runs on
      # the triggering ref, so the github-pages environment rules still apply.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check whether the owner enabled Actions Pages
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json" 2> "$RUNNER_TEMP/pages-error.txt"; then
            if node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1])); process.exit(p.build_type === "workflow" ? 0 : 1)' "$RUNNER_TEMP/pages.json"; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::notice::Pages is not configured for GitHub Actions; no publication attempted.'
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-error.txt"; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Pages is disabled; owner approval and setup are required.'
          else
            cat "$RUNNER_TEMP/pages-error.txt"
            exit 1
          fi
      - uses: actions/setup-node@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Test the offline page
        if: steps.pages.outputs.enabled == 'true'
        run: node --test site/build.test.mjs site/fetch-release.test.mjs
      - name: Fetch published release metadata and launch media
        if: steps.pages.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/fetch-release.mjs "$RUNNER_TEMP/launch-page"
      - name: Build the page
        if: steps.pages.outputs.enabled == 'true'
        run: node site/build.mjs --release "$RUNNER_TEMP/launch-page/latest.json" --media "$RUNNER_TEMP/launch-page/media"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site/dist

  deploy:
    if: needs.build.outputs.enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
