<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="VoxClip">
  <title>VoxClip</title>
  <!-- Windows 16 px, hinted to the pixel grid. Render at exactly 16 px. -->
  <defs><linearGradient id="vc-plate" x1="0" y1="0" x2="0" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2E3037"/><stop offset="1" stop-color="#15161A"/></linearGradient></defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#vc-plate)"/>
  <rect x="3" y="6" width="2" height="4" rx="1" fill="#F3F0E7"/>
  <rect x="6" y="4" width="2" height="8" rx="1" fill="#F3F0E7"/>
  <rect x="11" y="5" width="2" height="6" rx="1" fill="#F3F0E7"/>
  <rect x="9" y="3" width="1" height="10" rx="0.5" fill="#F38F83"/>
</svg>
