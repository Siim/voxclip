  <rect x="1" y="1" width="22" height="22" rx="4.5" fill="url(#vc-plate)"/>
  <rect x="4" y="9" width="2" height="6" rx="1" fill="#F3F0E7"/>
  <rect x="7" y="7" width="2" height="10" rx="1" fill="#F3F0E7"/>
  <rect x="15" y="8" width="2" height="8" rx="1" fill="#F3F0E7"/>
  <rect x="18" y="10" width="2" height="4" rx="1" fill="#F3F0E7"/>
  <rect x="11" y="5" width="2" height="14" rx="1" fill="#F38F83"/>
</svg>
