  <rect x="3" y="3" width="42" height="42" rx="8.25" fill="url(#vc-plate)"/>
  <rect x="10" y="18" width="4" height="12" rx="2" fill="#F3F0E7"/>
  <rect x="16" y="14" width="4" height="20" rx="2" fill="#F3F0E7"/>
